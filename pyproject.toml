[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stdplot"
authors = [
    { name="G-Lauz", email="gabriel.lauzier@usherbrooke.ca" },
]
description = "A standardize wrapper around `matplotlib` targetting a variety of canvases."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "Framework :: Matplotlib",
  "Operating System :: OS Independent",
]
dynamic = ["version"]
dependencies = ["matplotlib>=3.11.2,<3.13", "scienceplots>=2.2"]

[project.optional-dependencies]
qt = ["PySide6"]
notebook = ["ipython"]
all = ["PySide6", "ipython"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["stdplot*"]

[tool.setuptools.package-data]
stdplot = ["py.typed"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.ruff]
target-version = "py311"

[tool.pyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/stdplot/ has no __init__.py; importlib mode keeps it from shadowing the package.
addopts = "--import-mode=importlib"
